[project]
name = "aimpoint"
version = "0.1.0"
description = "A harness for beneficial-capability environments: reproducible, judge-free evals that double as RL environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aayush Gandhi" }]
keywords = ["ai-safety", "evaluation", "rl-environment", "inspect-ai", "beneficial-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Floor is the version this is verified against. `eval()` takes generation
    # settings as keyword arguments; older releases wrapped them in a `config`
    # object, and the two forms are not compatible.
    "inspect-ai>=0.3.252",
    "pydantic>=2.7",
    "numpy>=1.26",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Dev tooling is a dependency-group (PEP 735) rather than an optional-dependency extra,
# because uv installs groups by default on both `uv sync` and `uv run`. As an extra it had
# to be requested on every single invocation, and any command that forgot silently
# recreated the environment without it, which is how ruff went missing mid-CI.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned: CI installs whatever `uv sync` resolves, and every new ruff release adds
    # rules that turn an unrelated PR red. Bump deliberately, with the fixes in the same PR.
    "ruff==0.16.7",
    "pyright>=1.1.380",
]

[project.scripts]
aimpoint = "aimpoint.cli:main"

# In-repo environments are discovered by scanning environments/ for environment.toml, so
# contributing one means adding a folder and nothing else. This entry-point group is for
# OUT-of-repo environments: anyone can pip-publish one and aimpoint will find it.
[project.entry-points."aimpoint.envs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that call a real model provider and cost money (deselected by default)",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
